name: Release
on:
  push:
    tags: ["mwrap-*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag, upstream version and bilingual entry pages
        run: python3 tools/check_mwrap_release.py --tag "$GITHUB_REF_NAME"
      - name: Run complete unit suite
        run: python3 -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Verify immutable upstream release mapping
        run: python3 tools/check_release.py --tag "$GITHUB_REF_NAME"
      - name: Require latest successful source CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" > "$RUNNER_TEMP/ci-runs.json"
          python3 tools/check_ci_run.py --runs "$RUNNER_TEMP/ci-runs.json" --sha "$GITHUB_SHA"
      - name: Build immutable source asset and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#mwrap-}"
          repo="${GITHUB_REPOSITORY#*/}"
          asset="${repo}-${version}.tar.gz"
          git archive --format=tar.gz --prefix="${repo}-${version}/" "$GITHUB_SHA" > "$RUNNER_TEMP/$asset"
          (cd "$RUNNER_TEMP" && sha256sum "$asset" > "$asset.sha256")
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to change immutable assets'; exit 1
          fi
          extra=()
          if [[ "$version" == *-rc* ]]; then extra+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/$asset" "$RUNNER_TEMP/$asset.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$repo $version" \
            --notes "Module wrapper for upstream $version. New mwrap package identities become installable after mcpp-index publication; see the bilingual README for the tested support scope." "${extra[@]}"
